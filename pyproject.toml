[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pythonos-nano"
version = "0.1.0"
description = "Nano-scale validation of the PythonOS-1B MoE architecture (locked v1.1 spec)"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy",
    # pythonos.tokenizer (StarCoder2 BPE) -- needed for corpus prep AND to
    # decode model output in scripts/evaluate.py, so this is a base
    # dependency, not corpus-build-only. huggingface-hub comes along as
    # tokenizers' own dependency (used for Tokenizer.from_pretrained).
    "tokenizers",
]

[project.optional-dependencies]
# only needed to build a corpus (data/*/prepare.py)
data = ["datasets", "tqdm", "requests"]
# optional run logging
logging = ["wandb"]

[tool.setuptools]
packages = ["pythonos"]
